name: Data pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate event contract
        run: python -m unittest discover -s tests -v
      - name: Generate deterministic telemetry
        run: python generator/generate_events.py --sessions 120 --seed 42
      - name: Build and test warehouse
        run: python pipeline/run_pipeline.py --reset
      - name: Verify deterministic cohort metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('dist/data/analytics.json').read_text())
          assert data['pipeline']['status'] == 'passed'
          assert data['metrics']['sessions'] == 120
          assert data['metrics']['normalized_events'] == 7514
          assert data['insight']['wave'] == 3
          PY
